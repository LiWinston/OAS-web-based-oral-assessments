server:
  port: 8081

spring:
  application:
    name: backend
  profiles:
    active: default
  mail:
    host: smtp.gmail.com
    port: 587
    username: use_your_own_to_test@gmail.com
    password: use_your_own_to_test
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  datasource:
    url: jdbc:mysql://localhost:3307/swen90017_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
    username: swen90017_user
    password: 90017
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: "Australia/Melbourne"
    date-format: yyyy-MM-dd HH:mm:ss

  # Thread pool configuration
  thread-pool:
    # Default thread pool configuration
    default:
      core-pool-size: 10
      max-pool-size: 50
      queue-capacity: 200
      keep-alive-seconds: 300
      thread-name-prefix: DefaultTask-
    # Async task executor configuration
    async:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100
      keep-alive-seconds: 60
      thread-name-prefix: Async-

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.swen90017.oas.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    org.swen90017.oas: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId}]){magenta} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId}] ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx"
  file:
    name: ./logs/oas-application.log
    # Ensure file logs use UTF-8 encoding
    charset: UTF-8

token:
  secret: jfNxVkcV8ESLUZBobgwoMawGDtVGlzt/r+ytDFPnU2iQpgw9q0CqzYbl+GIiX6Ct8ZJGMgrgqs10QCjV2H3e9g==
  # Access token validity period (in minutes)
  expireTime: 15
  # Refresh token validity period (in days)
