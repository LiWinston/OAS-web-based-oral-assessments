server:
  port: 8081

spring:
  application:
    name: backend
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3307/testdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: swen90017_user
    password: 90017
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: 54.206.56.77
    port: 6379

  # Thread pool configuration
  thread-pool:
    # Default thread pool configuration
    default:
      core-pool-size: 10
      max-pool-size: 50
      queue-capacity: 200
      keep-alive-seconds: 300
    # possible to add more
    # other-pool:
    #   core-pool-size: 5
    #   ...

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.swen90017.oas.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    org.swen90017.oas: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId}]){magenta} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId}] ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx"
  file:
    name: ./logs/oas-application.log
    # Ensure file logs use UTF-8 encoding
    charset: UTF-8
