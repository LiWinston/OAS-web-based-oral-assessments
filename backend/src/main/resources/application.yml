server:
  port: 8081

spring:
  application:
    name: backend
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3307/testdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: swen90017_user
    password: 90017
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: 54.206.56.77
    port: 6379

  # Thread pool configuration
  thread-pool:
    # Default thread pool configuration
    default:
      core-pool-size: 10
      max-pool-size: 50
      queue-capacity: 200
      keep-alive-seconds: 300
