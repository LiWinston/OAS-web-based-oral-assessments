server:
  port: 8081

spring:
  application:
    name: backend
  profiles:
    active: default

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  datasource:
    url: jdbc:mysql://172.22.149.174:3306/swen90017_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    url: ${REDIS_URL:rediss://red-d2li6ljipnbc7389b7jg:wX3WFQmNQeqX9hGXLfSolL1WvKmiq1da@singapore-keyvalue.render.com:6379}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  jackson:
    time-zone: "Australia/Melbourne"
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  mvc:
    format:
        date-time: yyyy-MM-dd HH:mm:ss
        date: yyyy-MM-dd
        time: HH:mm:ss

  thread-pool:
    default:
      core-pool-size: 10
      max-pool-size: 50
      queue-capacity: 200
      keep-alive-seconds: 300
      thread-name-prefix: DefaultTask-
    async:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100
      keep-alive-seconds: 60
      thread-name-prefix: Async-

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.swen90017.oas.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    org.swen90017.oas: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId}]){magenta} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId}] ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx"
  file:
    name: ./logs/oas-application.log
    charset: UTF-8

token:
  secret: ${JWT_SECRET}
  expireTime: 1500
  refreshExpireTime: 30

# Email domain suffix validation switch (true: enable, false: disable)
email:
  domain-validation:
    enabled: ${EMAIL_DOMAIN_VALIDATION_ENABLED:false}
csv:
  import:
    use-email-column: ${CSV_IMPORT_USE_EMAIL_COLUMN:false}
    storage-path: ${CSV_STORAGE_PATH:./csv-imports}

# CORS Configuration
cors:
  # Allowed frontend domains; uses CORS_ALLOWED_ORIGINS env var or defaults to localhost
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://172.22.82.23:3000,http://172.22.215.14:3000,http://172.22.240.185:3000,http://172.22.178.108:3000,,http://177.22.240.162:3000}
  # Whether to allow credentials (e.g., cookies, Authorization headers)
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  # Preflight request cache duration (in seconds)
  max-age: ${CORS_MAX_AGE:3600}
  # Allowed HTTP methods
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD}
  # Allowed request headers
  allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers,X-Trace-ID,X-CSRF-TOKEN}
  # Response headers exposed to the frontend
  exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,Content-Disposition,X-Trace-ID,Access-Control-Allow-Origin,Access-Control-Allow-Credentials}


