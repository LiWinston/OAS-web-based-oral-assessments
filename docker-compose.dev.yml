version: '3.8'

# Development docker-compose - only for development tools
# The main application should be run with `npm run dev` locally

services:
  # Redis (optional - for session storage/caching during development)
  redis:
    image: redis:7-alpine
    container_name: oas-redis-dev
    ports:
      - "6379:6379"
    networks:
      - oas-network
    restart: unless-stopped

networks:
  oas-network:
    external: true