<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" aria-label="Aggregation Diagram">

<style>
  .s { stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .f { fill: currentColor; }
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif; 
       font-size: 18px; fill: currentColor; letter-spacing: .2px; }
  .tl { font-family: inherit; font-size: 20px; font-weight: 600; fill: currentColor; letter-spacing: .3px; }
  .sub { font-size: 14px; fill: currentColor; opacity: .75; }
</style>

<text x="450" y="36" text-anchor="middle" class="tl">Multiple Examiners → Aggregation Rule → Final Mark</text>

<!-- left: examiner panels -->
<g class="s">
  <rect x="40" y="80" width="180" height="90" rx="10"/>
  <text x="130" y="112" text-anchor="middle" class="t">Examiner A</text>
  <path d="M60 124 h140"/>
  <path d="M60 140 h88"/>
  <path d="M60 156 h120"/>

  <rect x="40" y="190" width="180" height="90" rx="10"/>
  <text x="130" y="222" text-anchor="middle" class="t">Examiner B</text>
  <path d="M60 234 h140"/>
  <path d="M60 250 h88"/>
  <path d="M60 266 h120"/>
</g>

<!-- funnel -->
<g class="s">
  <path d="M260 100 h260 l-90 90 v40 l-80 50 v-90 z"/>
  <text x="390" y="132" text-anchor="middle" class="t">Aggregation</text>
  <text x="390" y="156" text-anchor="middle" class="sub">Average / Max / Min</text>
</g>

<!-- right: final certificate -->
<g class="s">
  <rect x="600" y="120" width="180" height="120" rx="12"/>
  <rect x="620" y="140" width="100" height="26" rx="5"/>
  <path d="M620 174 h100 M620 192 h68"/>
  <circle cx="710" cy="204" r="14"/>
  <path d="M704 204 l5 5 l9 -12"/>
  <text x="690" y="258" text-anchor="middle" class="t">Final Mark</text>
</g>

<!-- arrows -->
<path d="M220 125 h36" class="s" marker-end="url(#arrow)"/>
<path d="M220 235 h36" class="s" marker-end="url(#arrow)"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" class="f"/>
  </marker>
</defs>
<path d="M 430 230 h 150" class="s" marker-end="url(#arrow)"/>
</svg>