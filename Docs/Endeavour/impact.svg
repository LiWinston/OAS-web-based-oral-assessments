<svg xmlns="http://www.w3.org/2000/svg" width="940" height="220" viewBox="0 0 940 220" aria-label="Impact (projected, text-only)">
<style>
  .s { stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif; fill: currentColor; letter-spacing: .2px; }
  .h { font-weight: 700; font-size: 24px; }
  .num { font-weight: 900; font-size: 64px; }
  .sub { font-size: 16px; opacity: .9; }
  .cap { font-size: 14px; opacity: .75; }
</style>

<text x="20" y="36" class="t h">Impact (projected)</text>

<!-- 3 equal cards -->
<g class="s">
  <rect x="20"  y="60" width="280" height="140" rx="18"/>
  <rect x="330" y="60" width="280" height="140" rx="18"/>
  <rect x="640" y="60" width="280" height="140" rx="18"/>
</g>

<!-- Card 1 -->
<text x="160" y="118" text-anchor="middle" class="t num">−90%</text>
<text x="160" y="146" text-anchor="middle" class="t sub">manual admin steps</text>
<text x="160" y="168" text-anchor="middle" class="t cap">replaced by automated flows</text>

<!-- Card 2 -->
<text x="470" y="118" text-anchor="middle" class="t num">−50%</text>
<text x="470" y="146" text-anchor="middle" class="t sub">examiner time per session</text>
<text x="470" y="168" text-anchor="middle" class="t cap">streamlined rubric &amp; comments</text>

<!-- Card 3 (text-only) -->
<text x="780" y="118" text-anchor="middle" class="t h">Fewer errors</text>
<text x="780" y="146" text-anchor="middle" class="t sub">rule-based aggregation</text>
<text x="780" y="168" text-anchor="middle" class="t sub">&amp; CSV validation</text>
</svg>
