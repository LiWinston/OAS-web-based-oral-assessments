<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" aria-label="Architecture at a glance (elbow arrow)">
<style>
  .s { stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .f { fill: currentColor; }
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif; font-size: 18px; fill: currentColor; letter-spacing: .2px; }
  .tl { font-size: 22px; font-weight: 600; fill: currentColor; letter-spacing: .3px; }
  .sub { font-size: 14px; fill: currentColor; opacity: .75; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" class="f"/>
  </marker>
</defs>

<text x="20" y="32" class="tl">Architecture at a glance</text>

<g class="s">
  <!-- Frontend -->
  <rect x="60" y="80" width="270" height="190" rx="16"/>
  <text x="195" y="110" text-anchor="middle" class="t">Frontend</text>
  <text x="195" y="134" text-anchor="middle" class="sub">Next.js • React • Tailwind</text>
  <rect x="110" y="150" width="170" height="80" rx="10"/>
  <path d="M125 175h140 M125 195h112"/>
  <text x="195" y="248" text-anchor="middle" class="sub">Browser</text>

  <!-- API -->
  <rect x="415" y="80" width="270" height="190" rx="16"/>
  <text x="550" y="110" text-anchor="middle" class="t">API</text>
  <text x="550" y="134" text-anchor="middle" class="sub">Spring Boot • REST • JWT</text>
  <rect x="465" y="150" width="170" height="80" rx="10"/>
  <path d="M480 175h140 M480 195h112"/>
  <text x="550" y="248" text-anchor="middle" class="sub">Service layer</text>

  <!-- Database -->
  <rect x="770" y="80" width="230" height="190" rx="16"/>
  <text x="885" y="110" text-anchor="middle" class="t">Database</text>
  <text x="885" y="134" text-anchor="middle" class="sub">MySQL • MyBatis-Plus</text>
  <ellipse cx="885" cy="160" rx="70" ry="18"/>
  <path d="M815 160v70a70 18 0 0 0 140 0v-70"/>
  <text x="885" y="248" text-anchor="middle" class="sub">Persistent store</text>

  <!-- Block-to-block arrows -->
  <path d="M330 190H415" marker-end="url(#arrow)"/>
  <path d="M685 190H770" marker-end="url(#arrow)"/>
</g>

<!-- External: Canvas (CSV I/O) -->
<g class="s" style="opacity:.95">
  <rect x="860" y="20" width="220" height="44" rx="10" stroke-dasharray="6 6"/>
  <text x="970" y="48" text-anchor="middle" class="t">External: Canvas (CSV I/O)</text>
  <!-- elbow path: up from API top, then right -->
  <path d="M550 80V44H860" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="720" y="40" text-anchor="middle" class="sub">Import / Export CSV</text>
</g>

<text x="330" y="212" text-anchor="end" class="sub">HTTPS / JSON</text>
<text x="770" y="212" text-anchor="end" class="sub">JDBC</text>
</svg>
