<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="Canvas CSV Pipeline">
  <!-- Title -->
  <text x="490" y="36" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="20" font-weight="600" letter-spacing=".3px" fill="currentColor">Canvas CSV ↔ OAS</text>

  <!-- Canvas block -->
  <rect x="60" y="90" width="250" height="140" rx="16"
        fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <text x="185" y="120" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="18" letter-spacing=".2px" fill="currentColor">Canvas (LMS)</text>
  <rect x="100" y="134" width="170" height="64" rx="8"
        fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <path d="M110 154 h100 M110 170 h120"
        fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <text x="185" y="220" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="14" fill="currentColor" opacity=".75">CSV roster • gradebook</text>

  <!-- OAS block -->
  <rect x="670" y="90" width="250" height="140" rx="16"
        fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <text x="795" y="120" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="18" letter-spacing=".2px" fill="currentColor">OAS</text>
  <rect x="720" y="134" width="170" height="64" rx="8"
        fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <path d="M730 154 h120 M730 170 h100"
        fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <text x="795" y="220" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="14" fill="currentColor" opacity=".75">Participants • Results</text>

  <!-- arrows: left-to-right -->
  <path d="M 320 160 H 650" fill="none" stroke="currentColor" stroke-width="2.25"
        stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <polygon points="660,160 648,154 648,166" fill="currentColor"/>
  <!-- arrows: right-to-left -->
  <path d="M 660 180 H 330" fill="none" stroke="currentColor" stroke-width="2.25"
        stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <polygon points="320,180 332,174 332,186" fill="currentColor"/>

  <text x="490" y="150" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="14" fill="currentColor" opacity=".75">Import CSV</text>
  <text x="490" y="194" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
        font-size="14" fill="currentColor" opacity=".75">Export Canvas‑compatible CSV</text>
</svg>
