<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS - Sign In</title>
    <!-- External CSS Libraries -->
    <link
      rel="stylesheet"
      href="https://cdn.staticfile.org/tailwindcss/2.2.19/tailwind.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
      }
      .dark body {
        background-color: #111827;
      }
      .login-card {
        background-color: white;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
      }
      .dark .login-card {
        background-color: #1f2937;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }
      .btn-primary {
        background-color: #2563eb;
        color: white;
        transition: all 0.2s ease;
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
      }
      .form-control {
        border: 1px solid #e5e7eb;
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }
      .form-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        outline: none;
      }
      .dark .form-control {
        background-color: #374151;
        border-color: #4b5563;
        color: #e5e7eb;
      }
      .dark .form-control:focus {
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      }
    </style>
  </head>
  <body
    class="antialiased min-h-screen flex items-center justify-center px-4 py-12 bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200"
  >
    <div class="max-w-sm w-full space-y-8">
      <!-- Logo and system name -->
      <div class="text-center">
        <div class="flex items-center justify-center space-x-2">
          <span class="text-4xl font-bold text-blue-600 dark:text-blue-400">OAS</span>
        </div>
        <h2 class="mt-2 text-3xl font-extrabold text-gray-900 dark:text-white">
          Oral Assessment System
        </h2>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
          University of Melbourne
        </p>
      </div>

      <!-- Login / Register card -->
      <div class="login-card px-8 py-12 dark:bg-gray-800 shadow">
        <!-- Login form -->
        <div>
          <form action="student-privacy-policy.html" method="GET"> <!-- Changed action to student-privacy-policy.html -->
            <div class="mb-4">
              <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                Email Address
              </label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control w-full"
                placeholder="your.email@student.unimelb.edu.au"
                required
              />
            </div>
            <div class="mb-4">
              <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                Password
              </label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control w-full"
                placeholder="••••••••"
                required
              />
            </div>
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center">
                <input
                  id="remember-me"
                  name="remember-me"
                  type="checkbox"
                  class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                />
                <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">
                  Remember me
                </label>
              </div>
              <div class="text-sm">
                <a 
                  href="#" 
                  class="text-blue-600 dark:text-blue-400 hover:underline"
                >
                  Forgot your password?
                </a>
              </div>
            </div>
            <div class="mb-4">
              <button
                type="submit"
                class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              >
                Sign in
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Footer info -->
      <div class="text-center text-sm text-gray-500 dark:text-gray-400 mt-8">
        <p>&copy; 2023 University of Melbourne Oral Assessment System</p>
      </div>
    </div>

    <!-- Removed Alpine.js as this is a static view -->

  </body>
</html>
