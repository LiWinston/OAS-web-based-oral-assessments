<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-b from-blue-100 via-white to-blue-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAS Account Activation - Set Password</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css">
  <script>
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    window.onload = function() {
      if(localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    }
    function goBack() {
      window.location.href = "step3.html";
    }
    function goNext() {
      // 可加表单校验
      const pwd = document.getElementById('password').value;
      const cpwd = document.getElementById('confirmPassword').value;
      const specialChar = /[!@#￥%&*]/;
      const upper = /[A-Z]/;
      const lower = /[a-z]/;
      if (pwd.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (!upper.test(pwd) || !lower.test(pwd)) {
        showError('Password must contain both uppercase and lowercase letters.');
        return;
      }
      if (!specialChar.test(pwd)) {
        showError('Password must contain at least one special symbol (e.g. !@#￥%&*).');
        return;
      }
      if (pwd !== cpwd) {
        showError('Passwords do not match.');
        return;
      }
      window.location.href = "step5.html";
    }
    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('errorMsg').classList.remove('hidden');
    }
    function clearError() {
      document.getElementById('errorMsg').classList.add('hidden');
    }
    function togglePwd(id, iconId) {
      const input = document.getElementById(id);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between transition-colors duration-300 dark:bg-gray-900">
  <!-- 顶部导航 -->
  <header class="flex items-center justify-between px-6 py-4">
    <div class="flex items-center">
      <span class="font-extrabold text-2xl text-blue-700 dark:text-blue-300 tracking-wide font-sans" style="letter-spacing:0.1em; font-family: 'Inter', 'Helvetica Neue', Arial, 'sans-serif'; font-weight: 600;">OAS</span>
    </div>
    <button onclick="toggleDarkMode()" aria-label="Toggle dark mode" class="text-gray-400 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 text-xl focus:outline-none">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <!-- 主体内容 -->
  <main class="flex-1 flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-xl md:max-w-2xl lg:max-w-3xl bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-10 md:p-14 flex flex-col items-center" style="font-family: 'Inter', 'Helvetica Neue', Arial, 'sans-serif'; font-weight: 300;">
      <!-- 进度条 -->
      <div class="w-full mb-8">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold text-blue-600 dark:text-blue-300">Step 4 of 5</span>
          <span class="text-xs text-gray-400 dark:text-gray-500">Set Password</span>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
          <div class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 80%;"></div>
        </div>
      </div>
      <!-- 表单内容 -->
      <h1 class="text-xl md:text-2xl font-semibold text-gray-800 dark:text-white mb-6 text-center" style="font-weight: 400;">Create Your Password</h1>
      <form class="w-full flex flex-col gap-6" onsubmit="event.preventDefault(); clearError(); goNext();">
        <div>
          <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="password">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"
              class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 font-light focus:outline-none focus:ring-2 focus:ring-blue-300 transition pr-12"
              style="font-weight: 300;">
            <button type="button" onclick="togglePwd('password','pwdIcon')" tabindex="-1"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 focus:outline-none">
              <i id="pwdIcon" class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1" for="confirmPassword">Confirm Password</label>
          <div class="relative">
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"
              class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 font-light focus:outline-none focus:ring-2 focus:ring-blue-300 transition pr-12"
              style="font-weight: 300;">
            <button type="button" onclick="togglePwd('confirmPassword','cpwdIcon')" tabindex="-1"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 focus:outline-none">
              <i id="cpwdIcon" class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <div id="errorMsg" class="hidden text-sm text-red-500 dark:text-red-400 text-center"></div>
        <div class="flex justify-between gap-4 mt-2">
          <button type="button" onclick="goBack()"
            class="flex-1 py-3 bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 rounded-xl shadow hover:bg-gray-200 dark:hover:bg-gray-600 transition font-medium"
            style="font-weight: 400;">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
          </button>
          <button type="submit"
            class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow transition font-medium flex items-center justify-center gap-2"
            style="font-weight: 400;">
            Next<i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </form>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-4 text-center">
        Password must be at least 8 characters, contain both uppercase and lowercase letters, and at least one special symbol (e.g. !@#￥%&*).<br>
        You can click the <i class="fa fa-eye"></i> icon to show or hide your password.
      </p>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="text-center text-xs text-gray-400 dark:text-gray-500 py-4">
    &copy; 2025 Oral Assessment System. All rights reserved.
  </footer>
</body>
</html>
