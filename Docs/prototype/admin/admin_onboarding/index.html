<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-b from-blue-100 via-white to-blue-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAS Account Activation - Welcome</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css">
  <script>
    // 亮/暗模式切换
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    window.onload = function() {
      if(localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between transition-colors duration-300 dark:bg-gray-900">
  <!-- 顶部导航 -->
  <header class="flex items-center justify-between px-6 py-4">
    <div class="flex items-center">
      <span class="font-extrabold text-2xl text-blue-700 dark:text-blue-300 tracking-wide font-sans" style="letter-spacing:0.1em; font-family: 'Inter', 'Helvetica Neue', Arial, 'sans-serif'; font-weight: 600;">OAS</span>
    </div>
    <button onclick="toggleDarkMode()" aria-label="Toggle dark mode" class="text-gray-400 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 text-xl focus:outline-none">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <!-- 主体内容 -->
  <main class="flex-1 flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-xl md:max-w-2xl lg:max-w-3xl bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-10 md:p-14 flex flex-col items-center" style="font-family: 'Inter', 'Helvetica Neue', Arial, 'sans-serif'; font-weight: 300;">
      <!-- 欢迎内容 -->
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2 text-center" style="font-weight: 400;">Welcome to OAS</h1>
      <p class="text-gray-500 dark:text-gray-300 text-center mb-8" style="font-weight: 300;">
        Oral Assessment System (OAS) helps you manage your speaking assessments efficiently.<br>
        Please follow the steps to activate your account.
      </p>
      <!-- 开始按钮 -->
      <a href="step2.html" class="w-full">
        <button class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow transition-all text-lg flex items-center justify-center gap-2" style="font-weight: 400;">
          <span>Start Activation</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </a>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="text-center text-xs text-gray-400 dark:text-gray-500 py-4">
    &copy; 2025 Oral Assessment System. All rights reserved.
  </footer>
</body>
</html>
