<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 1800">
  <!-- Title -->
  <text x="550" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Booking Scheduling Sequence Diagram - OAS</text>

  <!-- Actors and Participants -->
  <defs>
    <symbol id="actor" viewBox="0 0 30 40">
      <circle cx="15" cy="10" r="8" fill="white" stroke="black" stroke-width="1.5"/>
      <line x1="15" y1="18" x2="15" y2="30" stroke="black" stroke-width="1.5"/>
      <line x1="5" y1="22" x2="25" y2="22" stroke="black" stroke-width="1.5"/>
      <line x1="15" y1="30" x2="5" y2="40" stroke="black" stroke-width="1.5"/>
      <line x1="15" y1="30" x2="25" y2="40" stroke="black" stroke-width="1.5"/>
    </symbol>
  </defs>

  <!-- Actor and Participants -->
  <use x="50" y="50" width="30" height="40" xlink:href="#actor"/>
  <text x="65" y="105" font-family="Arial" font-size="12" text-anchor="middle">Student</text>
  <rect x="150" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="200" y="85" font-family="Arial" font-size="12" text-anchor="middle">Frontend</text>
  <rect x="270" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="320" y="85" font-family="Arial" font-size="12" text-anchor="middle">BookingCtrl</text>
  <rect x="390" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="440" y="85" font-family="Arial" font-size="12" text-anchor="middle">TimeSlotCtrl</text>
  <rect x="510" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="560" y="85" font-family="Arial" font-size="12" text-anchor="middle">BookingSvc</text>
  <rect x="630" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="680" y="85" font-family="Arial" font-size="12" text-anchor="middle">TimeSlotSvc</text>
  <rect x="750" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="800" y="85" font-family="Arial" font-size="12" text-anchor="middle">NotifSvc</text>
  <rect x="870" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="920" y="85" font-family="Arial" font-size="12" text-anchor="middle">EmailSvc</text>
  <rect x="990" y="60" width="60" height="40" fill="#F2F2F2" stroke="#000000" rx="5" ry="5"/>
  <text x="1020" y="85" font-family="Arial" font-size="12" text-anchor="middle">DB</text>

  <!-- Lifelines -->
  <line x1="65" y1="110" x2="65" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="200" y1="110" x2="200" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="320" y1="110" x2="320" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="440" y1="110" x2="440" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="560" y1="110" x2="560" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="680" y1="110" x2="680" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="800" y1="110" x2="800" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="920" y1="110" x2="920" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1020" y1="110" x2="1020" y2="1750" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Section: View Available Time Slots -->
  <rect x="50" y="130" width="1000" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="550" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">View Available Time Slots</text>

  <!-- Sequence for View Available Time Slots -->
  <line x1="65" y1="180" x2="200" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="175" font-family="Arial" font-size="10" text-anchor="middle">Access booking page</text>
  
  <line x1="200" y1="200" x2="440" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="195" font-family="Arial" font-size="10" text-anchor="middle">getAvailableTimeSlots(assignmentId)</text>
  
  <line x1="440" y1="220" x2="680" y2="220" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="215" font-family="Arial" font-size="10" text-anchor="middle">getAvailableTimeSlots(assignmentId)</text>
  
  <line x1="680" y1="240" x2="1020" y2="240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="235" font-family="Arial" font-size="10" text-anchor="middle">Query available time slots</text>
  
  <line x1="1020" y1="260" x2="680" y2="260" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="850" y="255" font-family="Arial" font-size="10" text-anchor="middle">Return time slots</text>
  
  <line x1="680" y1="280" x2="440" y2="280" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="560" y="275" font-family="Arial" font-size="10" text-anchor="middle">Time slot DTOs</text>
  
  <line x1="440" y1="300" x2="200" y2="300" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="320" y="295" font-family="Arial" font-size="10" text-anchor="middle">Time slot DTOs</text>
  
  <line x1="200" y1="320" x2="65" y2="320" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="315" font-family="Arial" font-size="10" text-anchor="middle">Display available time slots</text>

  <!-- Section: Create Booking -->
  <rect x="50" y="350" width="1000" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="550" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Create Booking</text>

  <!-- Sequence for Create Booking -->
  <line x1="65" y1="400" x2="200" y2="400" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="395" font-family="Arial" font-size="10" text-anchor="middle">Select time slot and submit</text>

  <line x1="200" y1="420" x2="320" y2="420" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="415" font-family="Arial" font-size="10" text-anchor="middle">createBooking(bookingDTO)</text>

  <!-- Note for bookingDTO -->
  <rect x="330" y="430" width="180" height="70" fill="#FFFFCC" stroke="#999999"/>
  <text x="340" y="445" font-family="Arial" font-size="10">bookingDTO contains:</text>
  <text x="340" y="460" font-family="Arial" font-size="10">- Time slot ID</text>
  <text x="340" y="475" font-family="Arial" font-size="10">- Student ID</text>
  <text x="340" y="490" font-family="Arial" font-size="10">- Group ID (for group assessment)</text>

  <line x1="320" y1="520" x2="560" y2="520" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="515" font-family="Arial" font-size="10" text-anchor="middle">createBooking(bookingDTO)</text>

  <line x1="560" y1="540" x2="680" y2="540" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="535" font-family="Arial" font-size="10" text-anchor="middle">getRemainingCapacity(timeSlotId)</text>

  <line x1="680" y1="560" x2="1020" y2="560" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="555" font-family="Arial" font-size="10" text-anchor="middle">Query time slot</text>

  <line x1="1020" y1="580" x2="680" y2="580" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="850" y="575" font-family="Arial" font-size="10" text-anchor="middle">Return time slot</text>

  <line x1="680" y1="600" x2="560" y2="600" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="620" y="595" font-family="Arial" font-size="10" text-anchor="middle">Remaining capacity</text>

  <!-- Alternative Fragment -->
  <rect x="100" y="620" width="900" height="400" fill="none" stroke="#999999" stroke-dasharray="5,2"/>
  <path d="M 100 640 L 1000 640" stroke="#999999" stroke-dasharray="1,1"/>
  <text x="120" y="635" font-family="Arial" font-size="10">alt</text>
  <text x="150" y="635" font-family="Arial" font-size="10">[Sufficient capacity]</text>
  <text x="150" y="655" font-family="Arial" font-size="10">[Insufficient capacity]</text>

  <!-- Sufficient capacity branch -->
  <line x1="560" y1="670" x2="1020" y2="670" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="665" font-family="Arial" font-size="10" text-anchor="middle">Insert booking record</text>

  <line x1="1020" y1="690" x2="560" y2="690" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="790" y="685" font-family="Arial" font-size="10" text-anchor="middle">Insert successful</text>

  <line x1="560" y1="710" x2="680" y2="710" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="705" font-family="Arial" font-size="10" text-anchor="middle">updateRemainingCapacity(timeSlotId)</text>

  <line x1="680" y1="730" x2="1020" y2="730" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="725" font-family="Arial" font-size="10" text-anchor="middle">Update time slot</text>

  <line x1="1020" y1="750" x2="680" y2="750" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="850" y="745" font-family="Arial" font-size="10" text-anchor="middle">Update successful</text>

  <line x1="560" y1="770" x2="800" y2="770" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="765" font-family="Arial" font-size="10" text-anchor="middle">sendBookingConfirmation(bookingId)</text>

  <line x1="800" y1="790" x2="1020" y2="790" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="785" font-family="Arial" font-size="10" text-anchor="middle">Insert notification</text>

  <line x1="1020" y1="810" x2="800" y2="810" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="910" y="805" font-family="Arial" font-size="10" text-anchor="middle">Insert successful</text>

  <line x1="800" y1="830" x2="920" y2="830" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="825" font-family="Arial" font-size="10" text-anchor="middle">sendTemplateEmail()</text>

  <line x1="920" y1="850" x2="800" y2="850" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="860" y="845" font-family="Arial" font-size="10" text-anchor="middle">Email sent</text>

  <line x1="800" y1="870" x2="560" y2="870" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="680" y="865" font-family="Arial" font-size="10" text-anchor="middle">Notification successful</text>

  <line x1="560" y1="890" x2="320" y2="890" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="440" y="885" font-family="Arial" font-size="10" text-anchor="middle">Booking object</text>

  <line x1="320" y1="910" x2="200" y2="910" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="260" y="905" font-family="Arial" font-size="10" text-anchor="middle">Booking DTO</text>

  <line x1="200" y1="930" x2="65" y2="930" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="925" font-family="Arial" font-size="10" text-anchor="middle">Show booking success</text>

  <!-- Path divider for alternative fragment -->
  <path d="M 100 950 L 1000 950" stroke="#999999" stroke-dasharray="1,1"/>
  
  <!-- Insufficient capacity branch -->
  <line x1="560" y1="970" x2="320" y2="970" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="440" y="965" font-family="Arial" font-size="10" text-anchor="middle">Throw booking failure exception</text>

  <line x1="320" y1="990" x2="200" y2="990" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="260" y="985" font-family="Arial" font-size="10" text-anchor="middle">Error message</text>

  <line x1="200" y1="1010" x2="65" y2="1010" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="1005" font-family="Arial" font-size="10" text-anchor="middle">Show booking failure</text>

  <!-- Section: Cancel Booking -->
  <rect x="50" y="1050" width="1000" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="550" y="1070" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cancel Booking</text>

  <!-- Sequence for Cancel Booking -->
  <line x1="65" y1="1100" x2="200" y2="1100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="1095" font-family="Arial" font-size="10" text-anchor="middle">Request to cancel booking</text>

  <line x1="200" y1="1120" x2="320" y2="1120" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="1115" font-family="Arial" font-size="10" text-anchor="middle">cancelBooking(bookingId)</text>

  <line x1="320" y1="1140" x2="560" y2="1140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="1135" font-family="Arial" font-size="10" text-anchor="middle">cancelBooking(bookingId)</text>

  <line x1="560" y1="1160" x2="1020" y2="1160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="1155" font-family="Arial" font-size="10" text-anchor="middle">Query booking</text>

  <line x1="1020" y1="1180" x2="560" y2="1180" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="790" y="1175" font-family="Arial" font-size="10" text-anchor="middle">Return booking</text>

  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Alternative Fragment for Cancel Booking -->
  <rect x="100" y="1200" width="900" height="240" fill="none" stroke="#999999" stroke-dasharray="5,2"/>
  <path d="M 100 1220 L 1000 1220" stroke="#999999" stroke-dasharray="1,1"/>
  <text x="120" y="1215" font-family="Arial" font-size="10">alt</text>
  <text x="150" y="1215" font-family="Arial" font-size="10">[Can cancel]</text>
  <text x="150" y="1235" font-family="Arial" font-size="10">[Cannot cancel]</text>

  <!-- Can cancel branch -->
  <line x1="560" y1="1240" x2="1020" y2="1240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="1235" font-family="Arial" font-size="10" text-anchor="middle">Update booking status=CANCELLED</text>

  <line x1="1020" y1="1260" x2="560" y2="1260" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="790" y="1255" font-family="Arial" font-size="10" text-anchor="middle">Update successful</text>

  <line x1="560" y1="1280" x2="320" y2="1280" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="440" y="1275" font-family="Arial" font-size="10" text-anchor="middle">Cancelled booking</text>

  <line x1="320" y1="1300" x2="200" y2="1300" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="260" y="1295" font-family="Arial" font-size="10" text-anchor="middle">Booking DTO (cancelled)</text>

  <line x1="200" y1="1320" x2="65" y2="1320" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="1315" font-family="Arial" font-size="10" text-anchor="middle">Show cancellation success</text>

  <!-- Path divider for alternative fragment -->
  <path d="M 100 1340 L 1000 1340" stroke="#999999" stroke-dasharray="1,1"/>
  
  <!-- Cannot cancel branch -->
  <line x1="560" y1="1360" x2="320" y2="1360" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="440" y="1355" font-family="Arial" font-size="10" text-anchor="middle">Throw cannot cancel exception</text>

  <line x1="320" y1="1380" x2="200" y2="1380" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="260" y="1375" font-family="Arial" font-size="10" text-anchor="middle">Error message</text>

  <line x1="200" y1="1400" x2="65" y2="1400" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="1395" font-family="Arial" font-size="10" text-anchor="middle">Show cannot cancel message</text>

  <!-- Section: Reschedule Booking (condensed version) -->
  <rect x="50" y="1460" width="1000" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="550" y="1480" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Reschedule Booking</text>

  <!-- Sequence for Reschedule Booking (simplified) -->
  <line x1="65" y1="1510" x2="200" y2="1510" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="1505" font-family="Arial" font-size="10" text-anchor="middle">Request to reschedule</text>

  <line x1="200" y1="1530" x2="440" y2="1530" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="1525" font-family="Arial" font-size="10" text-anchor="middle">getAvailableTimeSlots()</text>

  <line x1="440" y1="1550" x2="200" y2="1550" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="320" y="1545" font-family="Arial" font-size="10" text-anchor="middle">Available time slots</text>

  <line x1="200" y1="1570" x2="65" y2="1570" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="1565" font-family="Arial" font-size="10" text-anchor="middle">Show available slots</text>

  <line x1="65" y1="1590" x2="200" y2="1590" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="1585" font-family="Arial" font-size="10" text-anchor="middle">Select new slot</text>

  <line x1="200" y1="1610" x2="320" y2="1610" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="1605" font-family="Arial" font-size="10" text-anchor="middle">rescheduleBooking(bookingId, newTimeSlotId)</text>

  <line x1="320" y1="1630" x2="560" y2="1630" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="1625" font-family="Arial" font-size="10" text-anchor="middle">rescheduleBooking(bookingId, newTimeSlotId)</text>

  <!-- Alternative Fragment for Reschedule Booking -->
  <rect x="100" y="1650" width="900" height="120" fill="none" stroke="#999999" stroke-dasharray="5,2"/>
  <path d="M 100 1670 L 1000 1670" stroke="#999999" stroke-dasharray="1,1"/>
  <text x="120" y="1665" font-family="Arial" font-size="10">alt</text>
  <text x="150" y="1665" font-family="Arial" font-size="10">[Reschedule successful]</text>

  <line x1="560" y1="1690" x2="320" y2="1690" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="440" y="1685" font-family="Arial" font-size="10" text-anchor="middle">Rescheduled booking</text>

  <line x1="320" y1="1710" x2="200" y2="1710" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="260" y="1705" font-family="Arial" font-size="10" text-anchor="middle">Booking DTO (rescheduled)</text>

  <line x1="200" y1="1730" x2="65" y2="1730" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="130" y="1725" font-family="Arial" font-size="10" text-anchor="middle">Show reschedule success</text>
</svg>
