<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1300">
  <!-- Title -->
  <text x="600" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">System Configuration Sequence Diagram - OAS (Updated)</text>

  <!-- Actors and Participants -->
  <defs>
    <symbol id="actor" viewBox="0 0 30 40">
      <circle cx="15" cy="10" r="8" fill="white" stroke="black" stroke-width="1.5"/>
      <line x1="15" y1="18" x2="15" y2="30" stroke="black" stroke-width="1.5"/>
      <line x1="5" y1="22" x2="25" y2="22" stroke="black" stroke-width="1.5"/>
      <line x1="15" y1="30" x2="5" y2="40" stroke="black" stroke-width="1.5"/>
      <line x1="15" y1="30" x2="25" y2="40" stroke="black" stroke-width="1.5"/>
    </symbol>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Actors and Participants -->
  <use x="50" y="50" width="30" height="40" xlink:href="#actor"/>
  <text x="65" y="105" font-family="Arial" font-size="12" text-anchor="middle">SuperAdmin</text>
  
  <use x="150" y="50" width="30" height="40" xlink:href="#actor"/>
  <text x="165" y="105" font-family="Arial" font-size="12" text-anchor="middle">CourseAdmin</text>
  
  <rect x="230" y="60" width="100" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="280" y="85" font-family="Arial" font-size="12" text-anchor="middle">Frontend</text>
  
  <rect x="350" y="60" width="120" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="410" y="85" font-family="Arial" font-size="12" text-anchor="middle">CourseCtrl</text>
  
  <rect x="490" y="60" width="120" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="550" y="85" font-family="Arial" font-size="12" text-anchor="middle">AssignmentCtrl</text>
  
  <rect x="630" y="60" width="120" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="690" y="85" font-family="Arial" font-size="12" text-anchor="middle">RubricCtrl</text>
  
  <rect x="770" y="60" width="120" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="830" y="85" font-family="Arial" font-size="12" text-anchor="middle">CourseSvc</text>
  
  <rect x="910" y="60" width="120" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="970" y="85" font-family="Arial" font-size="12" text-anchor="middle">AssignmentSvc</text>
  
  <rect x="1050" y="60" width="120" height="40" fill="#E6F2FF" stroke="#000000" rx="5" ry="5"/>
  <text x="1110" y="85" font-family="Arial" font-size="12" text-anchor="middle">RubricSvc</text>
  
  <rect x="1170" y="60" width="40" height="40" fill="#F2F2F2" stroke="#000000" rx="5" ry="5"/>
  <text x="1190" y="85" font-family="Arial" font-size="12" text-anchor="middle">DB</text>

  <!-- Lifelines -->
  <line x1="65" y1="110" x2="65" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="165" y1="110" x2="165" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="280" y1="110" x2="280" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="410" y1="110" x2="410" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="550" y1="110" x2="550" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="690" y1="110" x2="690" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="830" y1="110" x2="830" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="970" y1="110" x2="970" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1110" y1="110" x2="1110" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1190" y1="110" x2="1190" y2="1250" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Section: Super Admin Course View -->
  <rect x="50" y="130" width="1150" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="625" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Super Admin High-Level Course View</text>

  <!-- Sequence for Super Admin Course View -->
  <line x1="65" y1="180" x2="280" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="172" y="175" font-family="Arial" font-size="10" text-anchor="middle">Access system courses overview</text>
  
  <line x1="280" y1="200" x2="410" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="195" font-family="Arial" font-size="10" text-anchor="middle">getAllCoursesSummary()</text>
  
  <line x1="410" y1="220" x2="830" y2="220" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="215" font-family="Arial" font-size="10" text-anchor="middle">findAllCoursesSummary()</text>
  
  <line x1="830" y1="240" x2="1190" y2="240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="235" font-family="Arial" font-size="10" text-anchor="middle">Query course summaries only</text>
  
  <line x1="1190" y1="260" x2="830" y2="260" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="1010" y="255" font-family="Arial" font-size="10" text-anchor="middle">Return course summaries</text>
  
  <!-- Note for Limited View -->
  <rect x="840" y="270" width="200" height="70" fill="#FFFFCC" stroke="#999999"/>
  <text x="850" y="285" font-family="Arial" font-size="10">Super Admin only gets:</text>
  <text x="850" y="300" font-family="Arial" font-size="10">- Course name</text>
  <text x="850" y="315" font-family="Arial" font-size="10">- Course code</text>
  <text x="850" y="330" font-family="Arial" font-size="10">- Coordinator name</text>
  <text x="850" y="345" font-family="Arial" font-size="10">- Academic period</text>
  
  <line x1="830" y1="360" x2="410" y2="360" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="620" y="355" font-family="Arial" font-size="10" text-anchor="middle">Course summary DTOs</text>
  
  <line x1="410" y1="380" x2="280" y2="380" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="345" y="375" font-family="Arial" font-size="10" text-anchor="middle">Course summary DTOs</text>
  
  <line x1="280" y1="400" x2="65" y2="400" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="172" y="395" font-family="Arial" font-size="10" text-anchor="middle">Display high-level course overview</text>

  <!-- Section: Course Admin Create Course -->
  <rect x="50" y="430" width="1150" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="625" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Course Admin Create Course</text>

  <!-- Sequence for Course Admin Create Course -->
  <line x1="165" y1="480" x2="280" y2="480" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="475" font-family="Arial" font-size="10" text-anchor="middle">Access course management</text>
  
  <line x1="280" y1="500" x2="410" y2="500" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="495" font-family="Arial" font-size="10" text-anchor="middle">getMyCourses(userId)</text>
  
  <line x1="410" y1="520" x2="830" y2="520" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="515" font-family="Arial" font-size="10" text-anchor="middle">findCoursesByAdmin(userId)</text>
  
  <line x1="830" y1="540" x2="1190" y2="540" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="535" font-family="Arial" font-size="10" text-anchor="middle">Query admin's courses</text>
  
  <line x1="1190" y1="560" x2="830" y2="560" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="1010" y="555" font-family="Arial" font-size="10" text-anchor="middle">Return admin's courses</text>
  
  <line x1="830" y1="580" x2="410" y2="580" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="620" y="575" font-family="Arial" font-size="10" text-anchor="middle">Course DTOs</text>
  
  <line x1="410" y1="600" x2="280" y2="600" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="345" y="595" font-family="Arial" font-size="10" text-anchor="middle">Course DTOs</text>
  
  <line x1="280" y1="620" x2="165" y2="620" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="222" y="615" font-family="Arial" font-size="10" text-anchor="middle">Display admin's courses</text>
  
  <line x1="165" y1="640" x2="280" y2="640" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="635" font-family="Arial" font-size="10" text-anchor="middle">Create new course</text>
  
  <line x1="280" y1="660" x2="410" y2="660" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="655" font-family="Arial" font-size="10" text-anchor="middle">createCourse(courseDTO)</text>
  
  <!-- Note for courseDTO -->
  <rect x="420" y="670" width="160" height="70" fill="#FFFFCC" stroke="#999999"/>
  <text x="430" y="685" font-family="Arial" font-size="10">courseDTO contains:</text>
  <text x="430" y="700" font-family="Arial" font-size="10">- Course name</text>
  <text x="430" y="715" font-family="Arial" font-size="10">- Course code</text>
  <text x="430" y="730" font-family="Arial" font-size="10">- Description</text>
  <text x="430" y="745" font-family="Arial" font-size="10">- Academic period ID</text>
  
  <line x1="410" y1="760" x2="830" y2="760" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="755" font-family="Arial" font-size="10" text-anchor="middle">createCourse(courseDTO, userId)</text>
  
  <line x1="830" y1="780" x2="1190" y2="780" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="775" font-family="Arial" font-size="10" text-anchor="middle">Insert course with admin ID</text>
  
  <line x1="1190" y1="800" x2="830" y2="800" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="1010" y="795" font-family="Arial" font-size="10" text-anchor="middle">Insert successful</text>
  
  <line x1="830" y1="820" x2="410" y2="820" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="620" y="815" font-family="Arial" font-size="10" text-anchor="middle">Course DTO</text>
  
  <line x1="410" y1="840" x2="280" y2="840" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="345" y="835" font-family="Arial" font-size="10" text-anchor="middle">Course DTO</text>
  
  <line x1="280" y1="860" x2="165" y2="860" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="222" y="855" font-family="Arial" font-size="10" text-anchor="middle">Show created course</text>

  <!-- Section: Configure Assignment -->
  <rect x="50" y="890" width="1150" height="30" fill="#EEEEEE" stroke="#CCCCCC"/>
  <text x="625" y="910" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Configure Assignment and Rubric</text>

  <!-- Sequence for Configure Assignment -->
  <line x1="165" y1="940" x2="280" y2="940" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="935" font-family="Arial" font-size="10" text-anchor="middle">Create new assignment</text>
  
  <line x1="280" y1="960" x2="550" y2="960" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="955" font-family="Arial" font-size="10" text-anchor="middle">createAssignment(assignmentDTO)</text>
  
  <line x1="550" y1="980" x2="970" y2="980" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="975" font-family="Arial" font-size="10" text-anchor="middle">createAssignment(assignmentDTO, userId)</text>
  
  <!-- Note for Course Validation -->
  <rect x="980" y="990" width="200" height="50" fill="#FFFFCC" stroke="#999999"/>
  <text x="990" y="1010" font-family="Arial" font-size="10">Validates that the course</text>
  <text x="990" y="1025" font-family="Arial" font-size="10">belongs to this Course Admin</text>
  
  <line x1="970" y1="1060" x2="1190" y2="1060" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1080" y="1055" font-family="Arial" font-size="10" text-anchor="middle">Insert assignment</text>
  
  <line x1="1190" y1="1080" x2="970" y2="1080" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="1080" y="1075" font-family="Arial" font-size="10" text-anchor="middle">Insert successful</text>
  
  <line x1="970" y1="1100" x2="550" y2="1100" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="760" y="1095" font-family="Arial" font-size="10" text-anchor="middle">Assignment DTO</text>
  
  <line x1="550" y1="1120" x2="280" y2="1120" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="415" y="1115" font-family="Arial" font-size="10" text-anchor="middle">Assignment DTO</text>
  
  <line x1="280" y1="1140" x2="165" y2="1140" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="222" y="1135" font-family="Arial" font-size="10" text-anchor="middle">Show created assignment</text>
  
  <line x1="165" y1="1160" x2="280" y2="1160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="1155" font-family="Arial" font-size="10" text-anchor="middle">Create rubric for assignment</text>
  
  <line x1="280" y1="1180" x2="690" y2="1180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="1175" font-family="Arial" font-size="10" text-anchor="middle">createRubric(rubricDTO)</text>
  
  <line x1="690" y1="1200" x2="1110" y2="1200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="1195" font-family="Arial" font-size="10" text-anchor="middle">createRubric(rubricDTO, userId)</text>
  
  <!-- Note for Assignment Validation -->
  <rect x="1120" y="1210" width="200" height="50" fill="#FFFFCC" stroke="#999999"/>
  <text x="1130" y="1230" font-family="Arial" font-size="10">Validates that assignment</text>
  <text x="1130" y="1245" font-family="Arial" font-size="10">belongs to admin's course</text>
  
  <line x1="1110" y1="1280" x2="1190" y2="1280" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1150" y="1275" font-family="Arial" font-size="10" text-anchor="middle">Insert rubric</text>
</svg>
